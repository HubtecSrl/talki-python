[project]
name = "talki"
version = "0.1.0b1"
description = "Python client for the Talki API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HubTec S.r.l." }]
requires-python = ">=3.11"
keywords = ["talki", "api", "client", "voice agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
    "anyio>=3.0.0",
]

[project.urls]
Homepage = "https://developers.talki.it"
Documentation = "https://developers.talki.it"
Repository = "https://github.com/HubtecSrl/talki-python"
Changelog = "https://github.com/HubtecSrl/talki-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]
# Only scripts/generate.py uses it. The exact pin, plus this project's lock,
# is what makes a regeneration reproduce the committed package.
codegen = ["openapi-python-client==0.29.1"]

[tool.uv]
default-groups = ["dev", "codegen"]

[tool.uv.build-backend]
module-name = "talki"
module-root = ""

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["talki"]

[tool.mypy]
strict = true
packages = ["talki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
